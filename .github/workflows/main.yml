name: Deploy Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      - name: Instalar dependências
        run: npm ci


      - name: Rodar ESLint
        run: npm run lint


      - name: Rodar testes
        run: npm run test:ci


      - name: Build
        run: npm run build


      - name: Deploy Vercel
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
